name: Build and deploy hub

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
      - '02_プロジェクト/soubetsu-gift/**'
  issues:
    types: [opened, closed, reopened, assigned, unassigned]
  schedule:
    - cron: '0 21 * * *' # UTC、日本時間 06:00
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare site
        run: |
          test -d docs
          mkdir -p _site
          cp -a docs/. _site/
      - name: Generate request and requirements HTML from Markdown
        run: python scripts/build-docs.py _site
      - name: Generate progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_ISSUE_COUNTS: 'true'
        run: python scripts/build-progress.py
      - name: Verify generated files
        run: |
          test -f _site/index.html
          test -f _site/assets/progress.json
          test -f _site/progress.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
