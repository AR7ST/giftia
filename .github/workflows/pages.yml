name: Build and deploy hub

on:
  push:
    branches: [main]
  issues:
    types: [opened, closed, reopened]
  schedule:
    - cron: '0 21 * * *' # UTC、日本時間 06:00
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare site
        run: |
          test -d docs
          mkdir -p _site
          cp -a docs/. _site/
      - name: Generate request and requirements HTML from Markdown
        run: python scripts/build-docs.py _site
      - name: Generate progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_ISSUE_COUNTS: 'false'
        run: python scripts/build-progress.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
